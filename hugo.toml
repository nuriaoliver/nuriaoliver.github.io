baseURL = 'https://www.nuriaoliver.com/'
languageCode = 'en-us'
title = 'Nuria Oliver'
theme = 'paige'

[markup.highlight]
noclasses = false
style = "github"

[params.paige.pages]
disable_authors = true
disable_date = true
disable_keywords = true
disable_next = true
disable_prev = true
disable_reading_time = true
disable_series = true
disable_toc = true
disable_word_count = true
maximize_heading_levels = true
normalize_heading_levels = true

[paige.pages.base_schema]
isAccessibleForFree = true
isFamilyFriendly = true

[params.paige.site]
disable_breadcrumbs = true
disable_credit = true

[params.paige.subpages]
disable_authors = true
disable_date = true
disable_keywords = true
disable_reading_time = true
disable_series = true
disable_summary = true
disable_word_count = true

[params.render_hooks.image]
errorLevel = 'warning' # ignore (default), warning, or error (fails the build)

[params.render_hooks.link]
errorLevel = 'warning' # ignore (default), warning, or error (fails the build)

[security]
  [security.http]
    methods = ["GET"]
    urls = ["https://pub.orcid.org/*", "https://orcid.org/*"]